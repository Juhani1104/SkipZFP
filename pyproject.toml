[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skipzfp"
version = "0.1.0"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "zarr>=3.4"]

[project.optional-dependencies]
test = ["pytest", "zfpy"]
experiments = ["zfpy", "numcodecs", "obstore", "scipy", "gstools", "matplotlib"]

[tool.setuptools]
packages = ["skipzfp"]

[project.entry-points."zarr.codecs"]
"skipzfp" = "skipzfp.codec:SkipZFPCodec"
