[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skipzfp"
version = "0.1.0"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "zarr>=3.1"]

[project.optional-dependencies]
test = ["pytest", "zfpy"]
experiments = ["zfpy", "numcodecs", "obstore", "matplotlib", "xarray", "dask", "gcsfs"]

[tool.setuptools]
packages = ["skipzfp"]

[project.entry-points."zarr.codecs"]
"skipzfp" = "skipzfp.codec:SkipZFPCodec"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-local-folder = ["baselines", "common", "helpers"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]
